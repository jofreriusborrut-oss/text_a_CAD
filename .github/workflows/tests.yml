name: tests

on:
  push:
    branches-ignore: ["ci-results"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries needed by OpenCascade
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglu1-mesa libxrender1 libxext6
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Tests
        run: |
          set +e
          python -m pytest -q --durations=8 2>&1 | tee pytest.txt
          echo "exit=${PIPESTATUS[0]}" >> pytest.txt
          pip list 2>/dev/null | grep -i -E "cadquery|ocp|numpy|scipy|flask|streamlit|trimesh" >> pytest.txt
          exit 0
      - name: Replay recorded Claude answers on real CadQuery
        if: always()
        run: |
          set +e
          python tools/eval_run.py --out ci-out > eval-log.txt 2>&1
          echo "eval_exit=$?" >> eval-log.txt
          cp eval-log.txt ci-out/ 2>/dev/null
          tail -40 eval-log.txt
          exit 0
      - name: Publish the test report to the ci-results branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp pytest.txt /tmp/out/ 2>/dev/null || true
          if [ -d ci-out ]; then cp -r ci-out/. /tmp/out/; fi
          cd /tmp/out
          echo "${GITHUB_SHA}" > sha.txt
          git init -q && git checkout -q -b ci-results
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Test report for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results
      - name: Fail the job if tests failed
        run: grep -q "^exit=0$" pytest.txt
